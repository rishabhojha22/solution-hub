services:
  - type: web
    name: solution-hub-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free

  - type: web
    name: solution-hub
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_GRAPH_API_URL
        fromService:
          type: web
          name: solution-hub-api
          property: host